name: Build Kodi add-on

on:
  push:
    tags:
      - "douban-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read add-on metadata
        id: metadata
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET

          addon = ET.parse("addon.xml").getroot()
          print(f"id={addon.attrib['id']}")
          print(f"version={addon.attrib['version']}")
          PY

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected_tag="douban-${{ steps.metadata.outputs.version }}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match add-on version $expected_tag" >&2
            exit 1
          fi

      - name: Build installable ZIP
        id: package
        shell: bash
        run: |
          addon_id="${{ steps.metadata.outputs.id }}"
          addon_version="${{ steps.metadata.outputs.version }}"
          archive="${addon_id}-${addon_version}.zip"

          mkdir -p "dist/${addon_id}"
          rsync -a \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".gitignore" \
            --exclude ".DS_Store" \
            --exclude "__pycache__/" \
            --exclude "*.py[co]" \
            --exclude "dist/" \
            --exclude "icon.xcf" \
            ./ "dist/${addon_id}/"
          (cd dist && zip -qr "$archive" "$addon_id")
          unzip -t "dist/${archive}"
          echo "archive=dist/${archive}" >> "$GITHUB_OUTPUT"
          echo "name=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
